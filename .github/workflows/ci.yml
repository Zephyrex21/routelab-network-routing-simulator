name: RouteLab CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: routelab-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, tests, browser smoke, production build and security audit
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run ESLint static checks
        run: npm run lint

      - name: Run automated tests
        run: npm test

      - name: Build production bundle
        run: npm run build

      - name: Install Chromium for browser smoke tests
        run: npm exec --yes --package=playwright@1.65.1 -- playwright install --with-deps chromium

      - name: Run browser smoke and workspace regression tests
        run: npm run test:e2e

      - name: Audit the complete dependency tree
        run: npm audit --audit-level=high
